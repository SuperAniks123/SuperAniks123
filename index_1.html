<html>
    <head>
        <link rel="shortcut icon" href="#">
        <title>nPogas</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <p id="laiks">0 s</p>
        <form id="forma">
            <input type="number" step="2" min="2" id="frame">
            <input type="button" value="Submit" onclick="cik(frame.value)">
        </form>
<!--        <img src="https://ajoma.pythonanywhere.com/static/a1.jpg"> -->
        <script>
            var ok=0;
            var nr=0;
            let sekundes=1;
            function cik(n){
                sekundes=1;
                if (ok===1){
                    const rindas = document.getElementById("rindas");
                    rindas.remove();
                    ok=0;
                }
                ok++;
                
            // funkcija atkārtoti tiks izsaukta ik pēc 1000 milisekundēm
            
            
                var num=0;
                console.log(n);
                var rindas=document.createElement("DIV"); rindas.setAttribute("id","rindas");
                document.body.appendChild(rindas);
                let bildes=randomPairs(frame.value);
                console.log(bildes);
                console.log("bildes");
                shuffle(bildes);
                console.log(bildes);
                for(let i=0;i<n;i++){
                    let rinda=document.createElement("DIV"); rinda.setAttribute("id","rinda");
                    rindas.appendChild(rinda);
                    for(let j=0;j<n;j++){
                        let button=document.createElement("button");
                        num++;
                        button.setAttribute("style", "width :60px; height :60px;");
                        //button.setAttribute("style", "margin: 0;");
                        //button.setAttribute("style", "padding 0;");
                        let iname='https://ajoma.pythonanywhere.com/static/'+bildes[nr];
                        nr++;
                        button.style.backgroundImage = "url("+iname+")";
                        button.style.backgroundSize = "60px 60px";
                        //button.style.backgroundImage = "url('https://ajoma.pythonanywhere.com/static/a1.jpg')";
                        //button.setAttribute("style","backgroundImage: url('https://ajoma.pythonanywhere.com/static/'+bildes[i])");
                        
                        rinda.appendChild(button);
                        //button.innerHTML("https://ajoma.pythonanywhere.com/static/a1.jpg");
                    }
                }
            }
            setInterval(function(){
               document.getElementById("laiks").innerHTML= sekundes+" s ";
               sekundes++;   
            },1000); 
            let bildes1 = ["a1.jpg","a2.jpg","a3.jpg","a4.jpg","a5.jpg","a6.jpg","a7.jpg","a8.jpg","a9.jpg"];
            let bildes2 = ["b1.jpg","b2.jpg","b3.jpg","b4.jpg","b5.jpg","b6.jpg","b7.jpg","b8.jpg","b9.jpg"];
            
            // funkcija vispirms izvēlas k nejaušus skaitļus tā, lai tie neatkārtojas
            // pēc tam izveido jaunu masīvu ar bildēm, kurām kā indeksus izmanto nejaušos skaitļus 
            function randomPairs(k){
                let randomi=new Set();
                let randomBildes=[];
                let n=bildes1.length;
                while(randomi.size<k*k/2){
                    randomi.add(Math.floor(Math.random()*n));
                }
                randomi.forEach((item)=>{
                    randomBildes.push(bildes1[item]);
                    randomBildes.push(bildes2[item]);
                });
                return randomBildes;
            }
            
            // funkcija sakārto masīvu nejaušā secībā jeb sajauc
            function shuffle(array) {
                array.sort(() => Math.random() - 0.5);
            }
            //vajag bildes uztaisit 40x40 px, tad dabut lai vinas paradas sajaukta seciba, tad talak domat par parejo
            //(lai apgrizas utt)
        </script>
    </body>
</html>
